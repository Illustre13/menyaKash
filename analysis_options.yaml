include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Downloaded third-party UI-inspiration app (also gitignored) — a
    # separate Flutter project whose imports can't resolve against this
    # app's dependencies, flooding the Problems panel with ~1,900 errors
    # that have nothing to do with our code.
    - assets/follow_along/**
    # Same reason: local-only assets/planning material, not app code.
    - public/**

linter:
  rules:
    prefer_single_quotes: true
    always_declare_return_types: true
