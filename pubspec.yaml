name: i_momo
description: Offline Mobile Money spending tracker — parses MoMo SMS on-device, zero cloud.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # SMS inbox read (historical scan) + live listener. Android-only.
  telephony: ^0.2.0

  # Local, on-device database. No network drivers included anywhere in this app.
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.2
  path: ^1.9.0

  # Cross-platform drift connection helper — picks a native sqlite3 file
  # on Android/desktop and a WASM/IndexedDB-backed database on web, so the
  # same AppDatabase class works in Chrome for UI testing without an
  # Android SDK. Web is a dev/testing target only: this app's real
  # features (SMS reading, USSD dialing) are Android-only regardless.
  drift_flutter: ^0.2.0

  # USSD quick-dial: builds tel: URIs and hands off to the native dialer.
  url_launcher: ^6.2.5

  # OS share sheet for the referral screen (spec #6) — hands off to
  # whatever the user already has installed (SMS/WhatsApp/etc), same
  # category as url_launcher above: no network capability of its own,
  # no new permission, this app never sees where it went.
  share_plus: ^10.0.0

  # Runtime permission requests (READ_SMS / RECEIVE_SMS / contacts).
  permission_handler: ^11.3.0

  # Phone contacts sync for the Pay screen's recipient picker. Android-only
  # in practice for this app, though the plugin itself is cross-platform.
  flutter_contacts: ^1.1.9+2

  # Charts for the analytics dashboard.
  fl_chart: ^0.68.0

  intl: ^0.19.0
  provider: ^6.1.2

  # SHA-256 hashing for SMS dedup keys (lib/data/database.dart hashSmsMessage).
  crypto: ^3.0.3

  # Biometric/PIN/pattern app lock (spec Phase 5 Security Setup, Phase 7
  # Settings). On-device hardware/OS prompt only — no network involved,
  # same category as permission_handler above.
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  drift_dev: ^2.16.0
  build_runner: ^2.4.9

  # Used directly in test/data/migration_test.dart to hand-build a real
  # v1-shaped database (raw SQL) and prove the v1->v2 upgrade migration
  # backfills it correctly — otherwise only a transitive dep via drift.
  sqlite3: ^2.4.0

  # Dev-time generator only (never shipped): produces the Android
  # launcher mipmaps from the Menya Kash brand asset. Re-run
  # `dart run flutter_launcher_icons` after changing the logo.
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/brand/menyacash_icon.png"
  # Fully transparent, not a solid color (spec review batch item #9):
  # a plain "#FFFFFF" background renders as an opaque white plate
  # behind the logo mark on the adaptive-icon mask. Android has no
  # literal "no background" adaptive-icon option, but a transparent PNG
  # background composites correctly on modern Android (the launcher's
  # own surface shows through), which is the real equivalent of "remove
  # the white background."
  adaptive_icon_background: "assets/brand/menyacash_background_transparent.png"
  adaptive_icon_foreground: "assets/brand/menyacash_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
