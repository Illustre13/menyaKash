org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Workaround: flutter_contacts (and possibly other unmaintained plugins)
# crash Kotlin's incremental compilation cache with a "storage already
# registered"/"different roots" error on this Gradle/Kotlin version,
# reproducibly, even from a clean build directory. Disabling incremental
# compilation avoids the crashing code path entirely — slower rebuilds,
# but correct ones. Revisit if/when the plugin is updated or replaced.
kotlin.incremental=false
